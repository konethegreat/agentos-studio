[package]
name = "agentos-studio"
version = "1.2.5"
description = "Native control plane and Rust MCP bus for multi-agent engineering fleets"
authors = ["Kone Tshivhinda", "K-ONE IT SOLUTIONS"]
license = "MIT"
repository = "https://github.com/konethegreat/agentos-studio"
edition = "2021"
rust-version = "1.80"

[lib]
name = "agentos_studio_lib"
crate-type = ["rlib"]

[[bin]]
name = "agentos-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
notify = "8"
walkdir = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
regex = "1"
which = "7"
dirs = "6"
anyhow = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
portable-pty = "0.9.0"
ureq = "3.2.1"
sha2 = "0.10.9"
ed25519-dalek = "2"
tauri-plugin-notification = "2"
agent-client-protocol = { version = "=5.0.0", features = ["process"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 1

[profile.test]
debug = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
