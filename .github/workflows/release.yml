name: Release

# Pushing a tag such as v0.2.0 builds installers for Windows, macOS and Linux
# and attaches them to a GitHub Release for that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach binaries to (for example v0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: ""
            slug: windows-x64
          - name: macOS Apple Silicon
            os: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_targets: aarch64-apple-darwin
            slug: macos-arm64
          - name: macOS Intel
            os: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_targets: x86_64-apple-darwin
            slug: macos-x64
          - name: Linux x64
            os: ubuntu-22.04
            args: ""
            slug: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Law 2 dash gate
        run: npm run check:dashes

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "AgentOS Studio ${{ env.RELEASE_TAG }}"
          releaseBody: |
            Installers for Windows (NSIS and MSI), macOS (Apple Silicon and Intel DMG) and Linux (AppImage, deb, rpm).

            The same binary is the native Rust agentos-hub MCP server:
            `agentos-studio --mcp-stdio --vault "<path to your vault>"`

            See the README for setup: https://github.com/${{ github.repository }}#readme
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # A stranger can compare the installer they downloaded with this file. One file per
      # platform so the four matrix jobs never overwrite each other on the release.
      - name: Publish SHA-256 checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out="SHA256SUMS-${{ matrix.slug }}.txt"
          : > "$out"
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            | sort | while IFS= read -r f; do
                if command -v sha256sum >/dev/null 2>&1; then
                  h=$(sha256sum "$f" | cut -d' ' -f1)
                else
                  h=$(shasum -a 256 "$f" | cut -d' ' -f1)
                fi
                # GitHub stores release assets with dots for spaces; list the names people download.
                name=$(basename "$f")
                printf '%s  %s\n' "$h" "${name// /.}" >> "$out"
              done
          cat "$out"
          gh release upload "$RELEASE_TAG" "$out" --clobber
